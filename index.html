<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151316">
  <title>Vesper · Lava Lamp Studio</title>
  <style>
    * {box-sizing:border-box}
    :root {color-scheme:dark;--ink:#f4eee6;--muted:#afa6a4;--line:#383236;--accent:#edb28e;--field:#171518;font-family:"DM Sans","Segoe UI",Arial,sans-serif}
    body {margin:0;background:#151316;color:var(--ink);min-width:280px}
    button,input {font:inherit} button {color:inherit;cursor:pointer} button:focus-visible,input:focus-visible {outline:2px solid #ffd6b5;outline-offset:5px}
    .shell {max-width:1560px;margin:auto;padding:0 clamp(18px,3.7vw,68px)}
    header {height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:12px}
    .identity,.wordmark,.screen-btn,.section-label,.panel-head,.slider-label,.light-row,.palette-name,.view-status,.scene-info {display:flex;align-items:center}
    .identity {gap:22px}.wordmark {gap:10px;font:italic 35px/.95 Georgia,"Times New Roman",serif;letter-spacing:-2.2px}.wordmark svg {width:26px;height:34px;color:var(--accent)}
    .studio {padding-left:20px;border-left:1px solid #494045;color:#c1b7b5;font-size:13px;letter-spacing:.015em}
    .screen-btn {gap:9px;border:1px solid #443d41;background:#201d21;border-radius:22px;padding:9px 14px;font-size:12px;font-weight:500}
    .screen-btn:hover,.round:hover,.reset:hover {background:#373034}.icon {width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    main {display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,322px);gap:20px;margin:26px 0 28px;align-items:stretch}
    .scene {background:#211820;position:relative;isolation:isolate;border-radius:18px;min-height:550px;height:clamp(550px,calc(100svh - 137px),860px);overflow:hidden;border:1px solid #493a40}
    #stage {position:absolute;inset:0;width:100%;height:100%;display:block}
    .view-status {position:absolute;top:22px;left:23px;gap:8px;text-transform:uppercase;font-size:9px;font-weight:650;letter-spacing:.155em;padding:7px 10px;background:#21181d99;border:1px solid #d0b1ac37;border-radius:20px;color:#f3dfd9}
    .status-dot {width:6px;height:6px;border-radius:50%;background:#f4ab80;box-shadow:0 0 8px #ef835666}.paused .status-dot {background:#aaa0a0;box-shadow:none}
    .scene-info {position:absolute;bottom:25px;left:26px;right:23px;justify-content:space-between;align-items:flex-end;pointer-events:none}
    .scene-info h1 {font:normal clamp(35px,3.8vw,57px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.06em;margin:0 0 7px;color:#fff1e2}
    .scene-info p {margin:0;color:#dfc9bd;font-size:12px;letter-spacing:.015em}
    .round {pointer-events:auto;display:grid;place-items:center;border:1px solid #dfc8bc66;border-radius:50%;width:43px;height:43px;background:#241a2099;color:#f7e1d6}
    .panel {background:#201d20;border:1px solid #383237;border-radius:18px;padding:clamp(19px,2vw,30px);align-self:stretch}
    .panel-head {justify-content:space-between;margin:0 0 25px}.panel h2 {margin:0;font:normal 30px/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.055em}
    .reset {display:grid;place-items:center;width:32px;height:32px;border:1px solid #494146;border-radius:50%;background:transparent;color:#c8bdb9}
    .section-label {font-size:10px;color:#c3b6b0;font-weight:650;letter-spacing:.15em;text-transform:uppercase;margin:0 0 13px}
    .palettes {display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .palette {padding:4px 4px 0;text-align:left;background:#282428;border:1px solid #433b40;border-radius:10px;position:relative;overflow:hidden}
    .palette:hover {border-color:#80716f}.palette[aria-pressed=true] {border-color:var(--accent);background:#332a29;box-shadow:0 0 0 .5px var(--accent)}
    .sample {height:49px;border-radius:6px;display:block;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 70% 100%,var(--p3),transparent 82%),linear-gradient(115deg,var(--p1),var(--p2))}
    .sample i,.sample b,.sample em {position:absolute;display:block;background:radial-gradient(ellipse at 27% 88%,var(--p5) 1%,var(--p4) 33%,var(--p3) 78%,var(--p2) 100%);box-shadow:inset 1px -1px 3px color-mix(in srgb,var(--p5) 70%,transparent);transform:rotate(-26deg)}
    .sample i {width:62%;height:145%;left:-10%;bottom:-68%;border-radius:37% 56% 40% 48%}
    .sample b {width:40%;height:83%;right:4%;top:-24%;border-radius:38% 50% 46% 53%}
    .sample em {width:12px;height:11px;border-radius:48% 45% 52% 43%;right:37%;top:50%}
    .palette:nth-child(2) .sample {transform:scaleX(-1)}.palette:nth-child(3) .sample i {transform:rotate(25deg);bottom:-49%}.palette:nth-child(4) .sample b {right:14%;top:-27%;transform:rotate(28deg)}
    .palette-name {height:30px;justify-content:space-between;padding:0 5px;font-size:12px;font-weight:500}.choice {width:12px;height:12px;opacity:0}.palette[aria-pressed=true] .choice {opacity:1;color:var(--accent)}
    .group {border-top:1px solid var(--line);margin-top:23px;padding-top:22px}
    .slider-label {justify-content:space-between;font-size:13px;font-weight:500}.slider-label output {font-variant-numeric:tabular-nums;color:#c9bbb6;font-size:12px}
    .slider {margin:0 0 15px}.slider:last-child {margin-bottom:0}
    input[type=range] {width:100%;height:26px;margin:5px 0 0;appearance:none;background:transparent;cursor:pointer;display:block}
    input[type=range]::-webkit-slider-runnable-track {height:3px;border-radius:9px;background:linear-gradient(to right,var(--accent) var(--fill),#484045 var(--fill))}
    input[type=range]::-moz-range-track {height:3px;border-radius:9px;background:#484045}input[type=range]::-moz-range-progress {height:3px;background:var(--accent)}
    input[type=range]::-webkit-slider-thumb {appearance:none;width:13px;height:13px;border-radius:50%;background:#f5d6bf;border:2px solid #f5d6bf;margin-top:-5px;box-shadow:0 1px 4px #0006}
    input[type=range]::-moz-range-thumb {border:0;width:13px;height:13px;border-radius:50%;background:#f5d6bf}
    .light-row {font-size:13px;justify-content:space-between;gap:10px}.light-name {display:inline-flex;gap:9px;align-items:center}.light-name svg {color:#d5beb0}
    .switch {border:0;width:33px;height:19px;border-radius:20px;padding:3px;background:#50484e}.switch[aria-checked=true] {background:var(--accent)}
    .switch span {display:block;height:13px;width:13px;background:#292124;border-radius:50%;transition:transform .2s}.switch[aria-checked=false] span {background:#e2d7d1}.switch[aria-checked=true] span {transform:translateX(14px)}
    body.immersive .scene {position:fixed;inset:0;width:100%;height:100%;min-height:0;z-index:20;border:none;border-radius:0}.exit {position:absolute;top:19px;right:20px;display:none;background:#261e25a8}.immersive .exit {display:flex}.immersive {overflow:hidden}
    @media(min-width:1600px){.shell{max-width:1670px}main{grid-template-columns:minmax(0,1fr) 350px}}
    @media(max-width:950px){.shell{padding:0 22px}main{gap:14px;grid-template-columns:minmax(0,1fr) 269px}.panel{padding:20px}.scene-info{left:19px}.studio{font-size:12px}}
    @media(max-width:700px){.shell{padding:0 15px}header{height:66px}.wordmark{font-size:30px;gap:7px}.wordmark svg{width:22px}.identity{gap:12px}.studio{padding-left:12px;font-size:11px}.screen-btn{padding:8px 10px;font-size:11px}main{display:flex;flex-direction:column;gap:14px;margin:15px 0 20px}.scene{min-height:340px;height:clamp(350px,68svh,650px)}.view-status{top:16px;left:16px}.scene-info{bottom:18px;left:18px;right:16px}.scene-info h1{font-size:33px}.panel{padding:21px}.panel-head{margin-bottom:18px}.panel h2{font-size:26px}.group{margin-top:19px;padding-top:18px}.palettes{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.sample{height:41px}.palette-name{font-size:11px;padding:0 1px}.choice{width:10px}.scene-info p{font-size:11px}}
    @media(max-width:370px){.studio{display:none}.palettes{grid-template-columns:1fr 1fr}.sample{height:36px}}
    @media(max-height:520px) and (min-width:701px){header{height:58px}main{margin-top:15px}.scene{min-height:465px}}
  </style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
  <symbol id="expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
  <symbol id="contract" viewBox="0 0 24 24"><path d="M3 8h5V3m8 0v5h5M3 16h5v5m8 0v-5h5"/></symbol>
  <symbol id="check" viewBox="0 0 16 16"><path d="m3.5 8 3 3 6-6.5" stroke-width="2"/></symbol>
  <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.8 4.8l1.4 1.4m11.6 11.6 1.4 1.4m0-14.4-1.4 1.4M6.2 17.8l-1.4 1.4"/></symbol>
</svg>
<div class="shell">
  <header>
    <div class="identity"><div class="wordmark"><svg viewBox="0 0 32 40" aria-hidden="true"><path fill="currentColor" d="M19.7 1.4c4 6.2 1.7 10.6-1.9 14.2-3.6 3.5-4.1 6.3-2.7 9.4-5.4-3.9-6.1-9.3-2.4-14.3 2.5-3.5 5.6-5.5 7-9.3ZM7.8 16.6c-.8 6.1 3.2 9.3 6.3 11.9 2.7 2.2 4.1 5 3.2 8.6-4.7.5-9.2-1.9-11.3-6.1-2.3-4.5-1.7-10.1 1.8-14.4Zm16.6-2.2c4.7 6.2 3.9 13.4-.1 18.6-1.1 1.5-2.6 2.7-4.3 3.4.9-5.1-2.4-7.7-2.2-11.2.2-4.2 5.1-6.3 6.6-10.8Z"/></svg>Vesper</div><span class="studio">Lava lamp studio</span></div>
    <button id="fullscreen" class="screen-btn"><svg class="icon"><use href="#expand"/></svg>Fullscreen</button>
  </header>
  <main>
    <section class="scene" aria-label="Lava lamp simulation">
      <canvas id="stage" role="img" aria-label="A glowing lava lamp with floating wax and brushed metal fittings">Your browser needs canvas support to display this simulation.</canvas>
      <div class="view-status"><span class="status-dot"></span><span id="status">Live view</span></div>
      <button class="screen-btn exit" id="exit"><svg class="icon"><use href="#contract"/></svg>Exit fullscreen</button>
      <div class="scene-info"><div aria-live="polite"><h1 id="title">Ember</h1><p id="description">Tangerine wax · Rose liquid</p></div><button class="round" id="play" aria-label="Pause simulation" title="Pause simulation"><svg id="play-icon" class="icon" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="3"/></svg></button></div>
    </section>
    <aside class="panel" aria-labelledby="settings"><div class="panel-head"><h2 id="settings">Lamp controls</h2><button class="reset" id="reset" title="Restore default settings" aria-label="Restore default settings"><svg class="icon" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1.4 7M4 4v6h6"/></svg></button></div>
      <section aria-labelledby="palette-label"><h3 class="section-label" id="palette-label">Color palette</h3><div class="palettes" id="palettes"></div></section>
      <section class="group" aria-labelledby="motion-label"><h3 class="section-label" id="motion-label">Motion</h3>
        <div class="slider"><div class="slider-label"><label for="heat">Heat</label><output for="heat" id="heat-value">65%</output></div><input type="range" id="heat" min="0" max="100" step="1" value="65"></div>
        <div class="slider"><div class="slider-label"><label for="speed">Flow speed</label><output for="speed" id="speed-value">1.0×</output></div><input type="range" id="speed" min="0.25" max="2" step="0.05" value="1"></div>
      </section>
      <section class="group" aria-labelledby="lighting-label"><h3 class="section-label" id="lighting-label">Lighting</h3><div class="light-row"><span class="light-name"><svg class="icon"><use href="#sun"/></svg>Room light</span><button class="switch" id="room" role="switch" aria-checked="true" aria-label="Room light"><span></span></button></div></section>
    </aside>
  </main>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const palettes = [
    { name:'Ember', desc:'Tangerine wax · Rose liquid', chips:['#391c27','#7d2e35','#c74b2d','#fc882c','#ffe29d'], room:[81,51,64], floor:[105,67,66], liquid:[136,44,62], deep:[158,29,14], wax:[255,83,14], hot:[255,228,126] },
    { name:'Lagoon', desc:'Seafoam wax · Teal liquid', chips:['#102e30','#155451','#25867a','#79e1c0','#d8ffe3'], room:[40,62,64], floor:[53,89,85], liquid:[30,102,113], deep:[12,111,96], wax:[62,218,164], hot:[201,255,183] },
    { name:'Orchid', desc:'Lilac wax · Violet liquid', chips:['#2c1a3c','#532e72','#9952af','#d29be7','#ffe2f4'], room:[60,45,73], floor:[86,65,97], liquid:[98,54,131], deep:[129,58,149], wax:[212,128,225], hot:[255,218,244] },
    { name:'Honey', desc:'Golden wax · Amber liquid', chips:['#352512','#64431d','#ae7429','#e8b34b','#fff0ac'], room:[72,58,43], floor:[100,79,54], liquid:[130,91,48], deep:[171,109,25], wax:[251,184,50], hot:[255,244,168] }
  ];
  const stage = $('stage'), ctx = stage.getContext('2d', {alpha:false});
  const scene = stage.parentElement;
  const layer = () => document.createElement('canvas');
  const background = layer(), foreground = layer(), glass = layer(), metal = layer(), wax = layer(), scattering=layer();
  scattering.width=140;scattering.height=290;
  const waxCtx = wax.getContext('2d');
  const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
  const mix = (a,b,t) => a+(b-a)*t;
  const smooth = (a,b,x) => { const v=clamp((x-a)/(b-a));return v*v*(3-2*v); };
  const bell = (x,w) => Math.exp(-x*x/(w*w));
  const css = (v,a=1) => 'rgba('+v.map(x=>Math.round(clamp(x,0,255))).join(',')+','+a+')';
  const blend = (a,b,t) => a.map((v,i)=>mix(v,b[i],t));
  const color = (v,k) => v.map(n=>n*k);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let selected=0, heat=.65, speed=1, lit=true, paused=reducedMotion, elapsed=0;
  let width=1,height=1,scale=1,cx=0,top=0,dpr=1,dirty=true,raf=0,previous=0,frameTime=0;
  let particles=[];
  const initial = [
    [-8,95,17,21,.30,1.1], [10,147,10,12,.79,2.8],
    [-12,204,26,31,.76,4.1], [-4,227,16,21,.70,5.0],
    [22,270,16,24,.82,3.4], [10,298,20,32,.89,.6],
    [-25,283,6,8,.39,5.8], [0,59,9,8,.27,2.1]
  ];
  function resetWax(){
    elapsed=0;
    particles=initial.map(([x,y,rx,ry,temp,phase],i)=>({x,y,rx,ry,temp,phase,
      vx:Math.cos(phase)*1.3,vy:(.52-temp)*11,cooling:temp<.5,index:i}));
  }
  function bottleRadius(y){
    if(y<39 || y>331)return 0;
    if(y<57)return 26+(y-39)*.12;
    if(y<282)return 28.16+(y-57)*.155;
    if(y<302)return 63.035+(y-282)*.133-(y-282)*(y-282)*.0021;
    return 64.855-(y-302)*.12-(y-302)*(y-302)*.0025;
  }
  function advance(dt){
    const t=elapsed+=dt;
    particles.forEach(p=>{
      const bottom=321-p.ry*.42, ceiling=54+p.ry*.55;
      if(p.y>bottom-1)p.cooling=false;
      if(p.y<ceiling+1)p.cooling=true;
      const floorHeat=smooth(237,320,p.y);
      const target=p.cooling ? .16+.13*floorHeat : .48+heat*.52;
      const rate=p.cooling ? .10+.14*(1-smooth(55,123,p.y)) : .07+.32*floorHeat;
      p.temp+= (target-p.temp)*(1-Math.exp(-dt*rate));
      const lift=(.51-p.temp)*(12+heat*12);
      p.vy+=(lift-p.vy)*(1-Math.exp(-dt*.62));
      const current=Math.sin(t*.057+p.phase+p.y*.013)*2.8+Math.sin(p.y*.021+t*.037)*1.7;
      p.vx+=(current-p.x*.085-p.vx)*(1-Math.exp(-dt*.43));
      p.y=clamp(p.y+p.vy*dt,ceiling,bottom);
      const bound=Math.max(1,bottleRadius(p.y)-p.rx*.84-4);
      p.x=clamp(p.x+p.vx*dt,-bound,bound);
    });
    // A weak short-range repulsion lets lobes join while keeping their centres mobile.
    for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){
      const a=particles[i],b=particles[j],dx=b.x-a.x,dy=b.y-a.y;
      const d=Math.hypot(dx,dy)||.01,contact=(a.rx+b.rx)*.67;
      if(d<contact){const f=(1-d/contact)*dt*2.8;a.vx-=dx/d*f;b.vx+=dx/d*f;a.vy-=dy/d*f;b.vy+=dy/d*f;}
    }
  }
  function glow(c,x,y,rx,ry,stops){
    c.save();c.translate(x,y);c.scale(Math.max(.001,rx),Math.max(.001,ry));
    const g=c.createRadialGradient(0,0,0,0,0,1);
    stops.forEach(([s,col])=>g.addColorStop(s,col));c.fillStyle=g;c.fillRect(-1,-1,2,2);c.restore();
  }
  function ellipse(c,x,y,rx,ry,fill){
    c.fillStyle=fill;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill();
  }
  function noise(x,y){
    let v=Math.imul(x+11313,374761393)+Math.imul(y+7127,668265263);
    v=Math.imul(v^(v>>>13),1274126177);return ((v^(v>>>16))>>>0)/4294967295;
  }
  const glassFactor=2, glassW=140,glassH=301,glassY=36;
  function makeGlass(p){
    glass.width=glassW*glassFactor;glass.height=glassH*glassFactor;
    const c=glass.getContext('2d'),im=c.createImageData(glass.width,glass.height);
    for(let iy=0;iy<glass.height;iy++){
      const y=iy/glassFactor+glassY;
      for(let ix=0;ix<glass.width;ix++){
        const x=ix/glassFactor-glassW/2,rad=bottleRadius(y),edge=rad-Math.abs(x);
        if(edge<0)continue;
        const u=x/rad, z=Math.sqrt(Math.max(0,1-u*u)),v=clamp((y-40)/290);
        const bottom=Math.pow(v,4), rim=Math.pow(1-z,2.1),index=(iy*glass.width+ix)*4;
        const dark=lit?1:.52;
        const wall=blend(color(p.room,.74*dark),color(p.liquid,.83),.65*z);
        const innerGlow=.14*bell(u-.25,.65)*(.28+v)+.55*bottom;
        let col=blend(wall,p.wax,innerGlow);
        const stripe=(.15*bell(u+.77,.16)+.07*bell(u-.63,.18))*dark;
        col=blend(col,[213,183,185],stripe);
        const rimlight=(.38*rim+.28*bell(edge-2,1.35))*(lit?1:.66);
      const grain=(noise(ix,iy)-.5)*1.4;
        for(let k=0;k<3;k++)im.data[index+k]=mix(col[k],p.hot[k]*.83,rimlight)+grain;
        im.data[index+3]=clamp(edge*glassFactor)*255;
      }
    }
    c.putImageData(im,0,0);
  }
  function hardwareRadius(y,cap){
    if(cap)return 22.8+clamp(y/40)*5.2;
    if(y<334)return 61.5+(y-328)*.24;
    if(y<412)return 62.94-(y-334)*.307;
    if(y<416)return 39;
    return 39+Math.pow(clamp((y-416)/56),1.13)*25;
  }
  function makeHardware(p){
    const q=2.5;metal.width=150*q;metal.height=485*q;
    const c=metal.getContext('2d'),im=c.createImageData(metal.width,metal.height);
    for(let iy=0;iy<metal.height;iy++){
      const screenY=iy/q,cap=screenY<52;
      if(!cap && screenY<325)continue;
      const start=cap?3:328,end=cap?42:472;
      for(let ix=0;ix<metal.width;ix++){
        const x=ix/q-75;
        let y=screenY,rad=hardwareRadius(y,cap),u=x/rad;
        if(Math.abs(x)>Math.max(hardwareRadius(screenY-5,cap),rad)+1)continue;
        for(let n=0;n<2;n++){const z=Math.sqrt(Math.max(0,1-u*u));y=screenY-(cap?2.9:5.1)*z;rad=hardwareRadius(y,cap);u=x/rad;}
        const edge=rad-Math.abs(x);
        if(y<start || y>end || edge<0)continue;
        const upper=y<414, t=cap?clamp((y-3)/39):upper?clamp((y-328)/86):clamp((y-414)/58);
        const drift=cap?-.04*t:upper?-.08*t:.11*t;
        const s=u+drift;
        // Reflected studio softboxes on the curved spun aluminium.
        let light=47+107*bell(s+.56,.37)+71*bell(s+.70,.105)+20*bell(s+.91,.045)
          +65*bell(s-.80,.20)+58*bell(s-.91,.061)+15*bell(s-.25,.20)-22*bell(s-.02,.20);
        light*=cap?(.87+.16*t):upper?(1.14-.36*t):(.85+.19*t);
        const band=cap?(.06*bell(y-35,2)):(.06*bell(y-349,13)+.09*bell(y-451,12));
        let shade=light*(1-band);
        const seam=cap?Math.max(.32*bell(y-40.3,.55),.18*bell(y-38.5,.32)):
          Math.max(.47*bell(y-332,.55),.38*bell(y-414.2,.70),.38*bell(y-468.9,.63),.65*smooth(470.4,472,y));
        const edgeFlash=cap?18*bell(y-4,.80):24*bell(y-328.8,.9)+15*bell(y-415.6,.65);
        shade=shade*(1-seam)+edgeFlash;
        const brush=(noise(0,iy)-.5)*4+(noise(ix>>3,iy)-.5)*2+(noise(ix,iy)-.5)*2;
        const lampReflection=cap?.09+.09*t:upper?.26*Math.exp(-(y-328)/19):.045*smooth(430,472,y);
        const ir=(iy*metal.width+ix)*4;
        for(let k=0;k<3;k++){
          const tint=[1.055,.995,1.01][k];
          const sky=shade*tint+(p.room[k]-61)*(.13+.28*(1-light/230));
          im.data[ir+k]=(sky*(lit?1:.34)+brush)*(1-lampReflection)+p.wax[k]*lampReflection;
        }
        im.data[ir+3]=clamp(Math.min(edge,y-start,end-y)*q+.5)*255;
      }
    }
    c.putImageData(im,0,0);c.scale(q,q);c.translate(75,0);
    const topGradient=c.createLinearGradient(-23,0,23,0);
    topGradient.addColorStop(0,lit?'#b9a8a6':'#524345');topGradient.addColorStop(.3,lit?'#d5c5bd':'#766160');
    topGradient.addColorStop(.68,lit?'#7c7075':'#392e37');topGradient.addColorStop(1,lit?'#a49395':'#58474e');
    ellipse(c,0,3.2,22.9,2.95,topGradient);
    c.beginPath();c.ellipse(0,3.4,22.35,2.62,0,.10,Math.PI*.92);c.strokeStyle=lit?'#f7e3dca3':'#a18f8573';c.lineWidth=.54;c.stroke();
  }
  function glassPath(c,inset=0){
    c.beginPath();
    for(let y=42;y<=331;y+=1.7){const x=bottleRadius(y)-inset;if(y===42)c.moveTo(-x,y);else c.lineTo(-x,y);}
    for(let y=331;y>=42;y-=1.7)c.lineTo(bottleRadius(y)-inset,y);
    c.closePath();
  }
  function stripe(c,u,width,y1,y2,stops,wave=0){
    const g=c.createLinearGradient(0,y1,0,y2);stops.forEach(([s,k])=>g.addColorStop(s,'rgba(255,239,234,'+k*(lit?1:.37)+')'));
    c.fillStyle=g;c.beginPath();
    for(let side=-1;side<=1;side+=2)for(let i=0;i<=72;i++){
      const f=side===-1?i/72:1-i/72,y=mix(y1,y2,f),r=bottleRadius(y);
      const x=r*(u+wave*Math.sin(f*3))+side*width*(.72+.28*Math.sin(f*Math.PI));
      if(side===-1&&i===0)c.moveTo(x,y);else c.lineTo(x,y);
    }
    c.closePath();c.fill();
  }
  function drawFront(c,p){
    c.save();glassPath(c);c.clip();
    stripe(c,-.976,.39,43,330,[[0,.45],[.29,.74],[.63,.46],[1,.62]]);
    stripe(c,-.91,1.30,46,326,[[0,.14],[.10,.72],[.20,.52],[.69,.16],[.88,.37],[1,.14]],.012);
    stripe(c,-.83,2.05,54,296,[[0,0],[.05,.26],[.58,.13],[.91,.05],[1,0]],.016);
    stripe(c,-.63,1.0,66,195,[[0,0],[.10,.16],[.79,.055],[1,0]],.028);
    stripe(c,.978,.48,43,330,[[0,.31],[.29,.56],[.63,.51],[1,.57]]);
    stripe(c,.91,.82,44,330,[[0,.29],[.34,.30],[.70,.085],[1,.38]],-.008);
    stripe(c,.74,2.6,51,320,[[0,0],[.16,.1],[.57,.095],[.83,.025],[1,0]],-.017);
    c.strokeStyle=css(blend(p.liquid,[240,224,220],.6),lit?.45:.22);c.lineWidth=.9;
    c.beginPath();c.ellipse(0,50,26.9,2.1,0,0,Math.PI*2);c.stroke();
    // Small imperfections in the glass catch the light at grazing angles.
    for(let i=0;i<41;i++){
      const y=55+noise(i,2)*265,u=(noise(i,3)*2-1)*.97;
      const x=bottleRadius(y)*u, r=.12+noise(i,5)**4*.48;
      ellipse(c,x,y,r,r*1.08,'rgba(255,229,209,'+(.04+.16*Math.abs(u))+')');
    }
    glow(c,0,326,61,20,[[0,css(p.hot,.32)],[.6,css(p.wax,.10)],[1,css(p.wax,0)]]);
    c.restore();c.drawImage(metal,-75,0,150,485);
  }
  const tile=layer();tile.width=tile.height=128;
  {const c=tile.getContext('2d'),img=c.createImageData(128,128);
    for(let i=0;i<img.data.length;i+=4){const val=noise(i%512,i>>9)>.5?255:0;img.data[i]=img.data[i+1]=img.data[i+2]=val;img.data[i+3]=Math.round(noise(i,31)*5);}
    c.putImageData(img,0,0);}
  function rebuild(){
    const box=scene.getBoundingClientRect();width=stage.clientWidth;height=stage.clientHeight;
    if(!box.width || !width || !height)return;
    dpr=Math.min(devicePixelRatio||1,2);
    for(const c of [stage,background,foreground]){c.width=Math.round(width*dpr);c.height=Math.round(height*dpr);}
    const p=palettes[selected];
    const small=width<480;
    scale=Math.min(height*(small?.76:.82)/478,width*(small?.46:.42)/131);
    top=(height-scale*478)*.41;cx=width*.51;
    const foot=top+scale*475;
    const c=background.getContext('2d');c.scale(dpr,dpr);
    const outer=lit?[36,27,36]:[15,13,19],back=lit?p.room:color(p.room,.31),floor=lit?p.floor:color(p.floor,.37);
    const wall=c.createLinearGradient(0,0,0,height);
    wall.addColorStop(0,css(blend(outer,back,.32)));wall.addColorStop(.49,css(blend(outer,back,.81)));wall.addColorStop(.76,css(back));
    wall.addColorStop(.89,css(blend(back,floor,.72)));wall.addColorStop(1,css(blend(floor,outer,.62)));c.fillStyle=wall;c.fillRect(0,0,width,height);
    glow(c,cx-width*.10,height*.44,width*.70,height*.78,[[0,css(blend(back,p.liquid,.24),.90)],[1,css(back,0)]]);
    glow(c,cx,foot-30*scale,scale*242,scale*175,[[0,css(p.wax,lit?.25:.32)],[.35,css(p.wax,.10)],[1,css(p.wax,0)]]);
    glow(c,cx,foot+5*scale,Math.min(width*.50,225*scale),scale*39,[[0,css(p.wax,.31)],[.34,css(p.wax,.16)],[1,css(p.wax,0)]]);
    glow(c,cx+scale*37,foot+scale*2,scale*162,scale*16,[[0,'#150d1ad9'],[.43,'#1c121763'],[1,'#25181e00']]);
    glow(c,cx,foot+scale*1.8,scale*75,scale*7,[[0,'#100b10f0'],[.69,'#150d12b3'],[1,'#150d1200']]);
    const shade=c.createRadialGradient(cx,height*.50,height*.18,cx,height*.5,Math.max(height*.79,width*.63));
    shade.addColorStop(0,'#120c1400');shade.addColorStop(.72,'#140e180b');shade.addColorStop(1,'#110e164f');c.fillStyle=shade;c.fillRect(0,0,width,height);
    c.fillStyle=c.createPattern(tile,'repeat');c.fillRect(0,0,width,height);
    makeGlass(p);makeHardware(p);c.translate(cx,top);c.scale(scale,scale);
    c.save();c.globalCompositeOperation='screen';
    glow(c,0,254,125,170,[[0,css(p.wax,.23)],[.38,css(p.wax,.11)],[.75,css(p.wax,.024)],[1,css(p.wax,0)]]);
    glow(c,0,317,96,39,[[0,css(p.hot,.23)],[.40,css(p.wax,.16)],[1,css(p.wax,0)]]);
    c.restore();c.drawImage(glass,-70,glassY,glassW,glassH);
    const f=foreground.getContext('2d');f.scale(dpr,dpr);f.translate(cx,top);f.scale(scale,scale);drawFront(f,p);
    dirty=false;
  }
  // Compact 3D metaball kernels. Their field gradient supplies a continuous normal
  // through every neck and merger, including where wax meets the bottom reservoir.
  const quality=1.65, startY=42,fw=Math.ceil(140*quality),fh=Math.ceil(290*quality);
  wax.width=fw;wax.height=fh;
  const field=new Float32Array(fw*fh),waxImage=waxCtx.createImageData(fw,fh);
  function deposit(x,y,rx,ry,strength,tilt,curve){
    const ax=rx*1.48,ay=ry*1.48;
    const y0=Math.max(0,Math.floor((y-ay-startY)*quality)),y1=Math.min(fh-1,Math.ceil((y+ay-startY)*quality));
    for(let row=y0;row<=y1;row++){
      const v=(row/quality+startY-y)/ay,rest=1-v*v;
      if(rest<=0)continue;
      const half=ax*Math.sqrt(rest),center=x+tilt*v+curve*(v*v-.26);
      const a=Math.max(0,Math.floor((center-half+70)*quality)),b=Math.min(fw-1,Math.ceil((center+half+70)*quality));
      let off=row*fw+a,dx=(a/quality-70-center)/ax;const step=1/(quality*ax);
      for(let col=a;col<=b;col++,off++,dx+=step){const val=rest-dx*dx;if(val>0)field[off]+=strength*val*val;}
    }
  }
  function renderWax(){
    const p=palettes[selected];field.fill(0);
    const sc=scattering.getContext('2d');
    sc.setTransform(1,0,0,1,0,0);sc.clearRect(0,0,140,290);sc.translate(70,-startY);
    sc.save();glassPath(sc,1);sc.clip();
    glow(sc,0,326,87,107,[[0,css(p.hot,.82)],[.25,css(p.wax,.65)],[.61,css(p.wax,.24)],[1,css(p.wax,0)]]);
    const t=elapsed;
    deposit(0,335,77,18+heat*6,1.10,0,0);
    deposit(-17+5*Math.sin(t*.08),322,25,14+heat*7,.83,-4,4);
    deposit(17+3*Math.sin(t*.09),318,19,22+heat*5,.76,4,-3);
    for(const b of particles){
      const wobble=Math.sin(t*.19+b.phase),squish=1+.075*wobble;
      const stretch=1+.075*Math.sin(t*.14+2*b.phase)+.07*Math.abs(b.vy)/9;
      deposit(b.x,b.y,b.rx*squish,b.ry*stretch/squish,1,-3.6*wobble,b.rx*.17*Math.cos(t*.17+b.phase));
      glow(sc,b.x,b.y,b.rx*2.35,b.ry*2.15,[[0,css(p.wax,.47)],[.43,css(p.wax,.27)],[.68,css(p.wax,.09)],[1,css(p.wax,0)]]);
    }
    sc.restore();
    const pix=waxImage.data,threshold=.315;
    pix.fill(0);
    for(let row=1;row<fh-1;row++){
      const y=row/quality+startY, radius=bottleRadius(y)-2.3;
      const min=Math.max(1,Math.floor((70-radius)*quality)),max=Math.min(fw-2,Math.ceil((70+radius)*quality));
      const bulb=smooth(205,328,y),heightLight=(heat*.42+.58)*bulb*bulb;
      for(let col=min;col<=max;col++){
        const id=row*fw+col, density=field[id],excess=density-threshold;
        if(excess<-.021)continue;
        const x=col/quality-70,edge=radius-Math.abs(x);
        if(edge<=0)continue;
        const gx=(field[id-1]-field[id+1])*quality*9.4,gy=(field[id-fw]-field[id+fw])*quality*9.4;
        const nz=Math.sqrt(Math.max(.009,excess)),inv=1/Math.hypot(gx,gy,nz);
        const nx=gx*inv,ny=gy*inv,z=nz*inv;
        const light=clamp((-.39*nx+.81*ny+.43*z+.12)/1.10);
        const thickness=clamp(excess*1.55);
        const scatter=.17*(1-thickness)+.16*light+.17*heightLight;
        const diffuse=clamp(.22+light*.64+.16*z+.13*heightLight);
        const hot=clamp(scatter+Math.pow(light,3)*.27+heightLight*.40+.31*smooth(302,332,y));
        const spec=Math.pow(clamp(-.64*nx-.46*ny+.62*z),15)*.045*(lit?1:.5);
        const fresnel=(1-z)**3*.07;
        const dest=id*4;
        for(let k=0;k<3;k++){
          const base=mix(p.deep[k],p.wax[k],diffuse);
          pix[dest+k]=mix(mix(base,p.hot[k],hot),249,spec+fresnel);
        }
        const grad=Math.hypot(gx,gy)/(18.8*quality);
        pix[dest+3]=255*clamp(.5+excess/Math.max(.009,grad))*clamp(edge*quality);
      }
    }
    waxCtx.putImageData(waxImage,0,0);
  }
  function draw(){
    if(dirty)rebuild();
    renderWax();
    ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(background,0,0);
    ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*cx,dpr*top);
    ctx.save();ctx.globalCompositeOperation='screen';ctx.drawImage(scattering,-70,startY);ctx.restore();
    ctx.drawImage(wax,-70,startY,fw/quality,fh/quality);
    ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(foreground,0,0);
  }
  function tick(now){
    raf=0;
    if(document.hidden)return;
    if(now-frameTime>=32 || dirty || paused){
      const dt=previous?Math.min(.12,(now-previous)/1000):0;previous=now;frameTime=now;
      if(!paused)advance(dt*speed);
      draw();
    }
    if(!paused)raf=requestAnimationFrame(tick);
  }
  function wake(rebuildScene=false){dirty=dirty||rebuildScene;if(!raf)raf=requestAnimationFrame(tick);}
  palettes.forEach((p,i)=>{
    const btn=document.createElement('button');btn.className='palette';btn.setAttribute('aria-pressed',String(i===selected));
    p.chips.forEach((col,k)=>btn.style.setProperty('--p'+(k+1),col));
    btn.innerHTML='<span class="sample" aria-hidden="true"><i></i><b></b><em></em></span><span class="palette-name">'+p.name+'<svg class="choice icon"><use href="#check"/></svg></span>';
    btn.addEventListener('click',()=>setPalette(i));$('palettes').appendChild(btn);
  });
  function setPalette(i){
    selected=i;const p=palettes[i];$('title').textContent=p.name;$('description').textContent=p.desc;
    Array.from($('palettes').children).forEach((b,n)=>b.setAttribute('aria-pressed',String(i===n)));
    stage.setAttribute('aria-label',p.name+' lava lamp. '+p.desc.replace(' · ',' in ')+'.');
    wake(true);
  }
  function sliders(){
    heat=Number($('heat').value)/100;speed=Number($('speed').value);
    $('heat-value').textContent=Math.round(heat*100)+'%';
    $('speed-value').textContent=(Number.isInteger(speed*10)?speed.toFixed(1):speed.toFixed(2))+'×';
    for(const el of [$('heat'),$('speed')]){
      el.style.setProperty('--fill',100*(el.value-el.min)/(el.max-el.min)+'%');
      el.setAttribute('aria-valuetext',el.id==='heat'?Math.round(heat*100)+' percent':speed+' times');
    }
    wake();
  }
  function showPlay(){
    const label=paused?'Resume simulation':'Pause simulation';
    $('play').setAttribute('aria-label',label);$('play').title=label;
    $('play-icon').innerHTML=paused?'<path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"/>':'<path d="M8 5v14m8-14v14" stroke-width="3"/>';
    $('status').textContent=paused?'Paused':'Live view';scene.classList.toggle('paused',paused);
    previous=0;wake();
  }
  $('heat').addEventListener('input',sliders);$('speed').addEventListener('input',sliders);
  $('play').addEventListener('click',()=>{paused=!paused;showPlay();});
  $('room').addEventListener('click',()=>{lit=!lit;$('room').setAttribute('aria-checked',String(lit));wake(true);});
  $('reset').addEventListener('click',()=>{resetWax();lit=true;paused=reducedMotion;$('heat').value=65;$('speed').value=1;$('room').setAttribute('aria-checked','true');sliders();setPalette(0);showPlay();});
  function immersive(on){
    document.body.classList.toggle('immersive',on);
    (on?$('exit'):$('fullscreen')).focus({preventScroll:true});wake(true);
  }
  $('fullscreen').addEventListener('click',async()=>{immersive(true);try{if(scene.requestFullscreen)await scene.requestFullscreen();}catch{/* Embedded browsers can use the expanded stage. */}});
  $('exit').addEventListener('click',async()=>{if(document.fullscreenElement)await document.exitFullscreen();immersive(false);});
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)immersive(false);});
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('immersive')&&!document.fullscreenElement)immersive(false);});
  document.addEventListener('visibilitychange',()=>{previous=0;if(!document.hidden)wake();});
  new ResizeObserver(()=>wake(true)).observe(scene);
  resetWax();sliders();setPalette(0);showPlay();
})();

</script>
